apiVersion: v1
kind: Secret
metadata:
  name: pgga-secrets
  namespace: pgga
  labels:
    app.kubernetes.io/name: pgga
    app.kubernetes.io/part-of: pg-ga-conf
type: Opaque
stringData:
  # IMPORTANT: Replace these with your actual values!
  # For production, use external secret management (Vault, AWS Secrets Manager, etc.)
  database-url: "postgres://postgres:postgres@postgres-service:5432/pgga"
  secret-key-base: "CHANGE_ME_TO_A_REAL_SECRET_KEY_BASE_AT_LEAST_64_CHARS_LONG_FOR_PRODUCTION"
