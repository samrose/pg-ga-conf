apiVersion: v1
kind: ConfigMap
metadata:
  name: pgga-config
  namespace: pgga
  labels:
    app.kubernetes.io/name: pgga
    app.kubernetes.io/part-of: pg-ga-conf
data:
  # Application configuration
  pool-size: "10"
  julia-health-check-interval: "30000"
  sobol-cache-ttl: "2592000000"  # 30 days in ms

  # Default tuning parameters
  default-max-iterations: "30"
  default-benchmark-duration: "60"
  default-benchmark-clients: "10"
